<html lang="ko">
<head>

    <style>
        :root {
            --ff-orange: #FF4B33;
            --ff-orange-hover: #E03E27;
            --ff-dark: #1E232A;
            --ff-gray-bg: #F3F5F7;
            --card-bg: #FFFFFF;
            --text-title: #0F172A;
            --text-body: #334155;
            --text-sub: #64748B;
            --border-color: #E2E8F0;
            --badge-bg: #FFEBE8;
            --badge-text: #FF4B33;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--ff-gray-bg);
            color: var(--text-body);
            line-height: 1.6;
            padding-bottom: 90px;
        }

        /* Top Header Navigation */
        header {
            position: sticky; top: 0; z-index: 100;
            background: #FFFFFF;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .header-top {
            max-width: 900px; margin: 0 auto;
            padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .brand-logo {
            font-weight: 800; font-size: 1.15rem; color: var(--ff-dark);
            display: flex; align-items: center; gap: 8px;
        }

        .brand-badge {
            background: var(--badge-bg); color: var(--badge-text);
            font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 6px;
        }

        .header-right { display: flex; align-items: center; gap: 10px; }

        .btn-admin-mode {
            background: var(--ff-dark); color: #FFFFFF; border: none;
            padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; cursor: pointer;
        }

        /* Search Bar */
        .search-container { max-width: 900px; margin: 0 auto; padding: 12px 16px; }
        .search-box { position: relative; }
        .search-input {
            width: 100%; padding: 12px 16px 12px 42px;
            background: #FFFFFF; border: 1.5px solid var(--border-color); border-radius: 10px;
            font-size: 0.92rem; font-weight: 600; outline: none; transition: all 0.2s;
        }
        .search-input:focus { border-color: var(--ff-orange); box-shadow: 0 0 0 3px rgba(255, 75, 51, 0.1); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-sub); }

        /* Dynamic Category Tabs */
        .nav-tabs-wrapper {
            overflow-x: auto; white-space: nowrap; background: #FFFFFF; border-top: 1px solid #F1F5F9; scrollbar-width: none;
        }
        .nav-tabs-wrapper::-webkit-scrollbar { display: none; }
        .nav-tabs { display: flex; max-width: 900px; margin: 0 auto; padding: 0 12px; }
        .tab-item {
            padding: 12px 16px; font-size: 0.9rem; font-weight: 700; color: var(--text-sub);
            border-bottom: 3px solid transparent; cursor: pointer; transition: all 0.2s;
        }
        .tab-item.active { color: var(--ff-orange); border-bottom-color: var(--ff-orange); }

        /* Main Container */
        .container { max-width: 900px; margin: 0 auto; padding: 20px 16px; }

        /* Hero Banner */
        .hero-banner {
            background: linear-gradient(135deg, #1E232A 0%, #2D3540 100%);
            border-radius: 16px; padding: 24px 20px; color: #FFFFFF; margin-bottom: 20px;
        }
        .hero-title { font-size: 1.45rem; font-weight: 800; line-height: 1.35; margin-bottom: 4px; }
        .hero-desc { font-size: 0.88rem; color: #94A3B8; }

        /* Drag & Drop Quick Widgets Grid */
        .grid-menu {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px;
        }
        @media (max-width: 600px) { .grid-menu { grid-template-columns: repeat(2, 1fr); } }

        .grid-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px;
            padding: 16px 12px; text-align: center; cursor: pointer; transition: all 0.2s;
            position: relative;
        }
        .grid-card:hover { border-color: var(--ff-orange); transform: translateY(-2px); }
        .grid-icon { font-size: 1.6rem; margin-bottom: 4px; }
        .grid-label { font-size: 0.85rem; font-weight: 700; color: var(--text-title); }

        /* Drag handle in Admin Mode */
        .drag-handle {
            display: none; position: absolute; top: 6px; right: 6px;
            background: var(--ff-orange); color: #fff; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; cursor: move;
        }
        .admin-active .drag-handle { display: block; }

        /* Section Cards */
        .section-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px;
            padding: 20px; margin-bottom: 16px;
        }
        .section-header { margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
        .section-title { font-size: 1.15rem; font-weight: 800; color: var(--text-title); }

        /* Info Item List */
        .info-item {
            padding: 12px 14px; background: var(--ff-gray-bg); border: 1px solid var(--border-color);
            border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: all 0.2s;
        }
        .info-item:hover { border-color: var(--ff-orange); background: #FFFFFF; }
        .info-item-title { font-weight: 700; font-size: 0.92rem; color: var(--text-title); }
        .info-item-sub { font-size: 0.8rem; color: var(--text-sub); }

        /* Modal Overlay & Popup */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 999;
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: #FFFFFF; border-radius: 20px; width: 100%; max-width: 560px;
            max-height: 85vh; overflow-y: auto; padding: 24px; position: relative;
        }
        .modal-close {
            position: absolute; top: 18px; right: 18px; background: var(--ff-gray-bg);
            border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: 800;
        }
        .modal-badge {
            background: var(--badge-bg); color: var(--badge-text); font-size: 0.75rem;
            font-weight: 800; padding: 3px 8px; border-radius: 6px; display: inline-block; margin-bottom: 10px;
        }
        .modal-title { font-size: 1.3rem; font-weight: 800; color: var(--text-title); margin-bottom: 10px; }
        .modal-body { font-size: 0.92rem; color: var(--text-body); line-height: 1.6; }
        .modal-body h4 { font-size: 1rem; margin: 14px 0 6px; color: var(--text-title); font-weight: 700; }
        .modal-body ul { padding-left: 18px; margin-bottom: 8px; }
        .modal-body li { margin-bottom: 4px; }

        .btn-copy-pw {
            background: var(--ff-orange); color: #FFFFFF; border: none; width: 100%;
            padding: 12px; border-radius: 10px; font-weight: 800; font-size: 0.95rem; cursor: pointer; margin-top: 12px;
        }

        /* Floating Chatbot Widget */
        .chatbot-widget {
            position: fixed; bottom: 20px; right: 20px; z-index: 500;
            display: flex; align-items: center; gap: 8px; text-decoration: none;
        }
        .chatbot-icon {
            width: 52px; height: 52px; background: var(--ff-orange); color: #FFFFFF;

            font-size: 1.4rem; box-shadow: 0 6px 18px rgba(255, 75, 51, 0.35); cursor: pointer;
        }

        /* Admin Mode Control Panel */
        .admin-panel {
            display: none; background: #FFF8F6; border: 2px solid var(--ff-orange);

        .admin-form-group { margin-bottom: 12px; }

            background: var(--ff-dark); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; cursor: pointer;

    </style>
</head>

        let currentData = defaultModalData;
        let currentCategories = defaultCategories;

        // Init App & URL Query Router
        window.onload = function() {
            // Check LocalStorage
            const stored = localStorage.getItem('ff_app_db');
            if (stored) {
                currentData = JSON.parse(stored);
            }

            // Check URL Mode (?mode=admin)
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('mode') === 'admin') {
                enableAdminMode();
            }

            renderTabs();
            renderSections();
            initDragAndDrop();
        };

        // Render Dynamic Tabs
        function renderTabs() {
            const container = document.getElementById('categoryTabContainer');
            container.innerHTML = currentCategories.map((c, idx) => `
                <div class="tab-item ${idx === 0 ? 'active' : ''}" onclick="switchTab('${c}', this)">${c}</div>
            `).join('');
        }

        // Render Dynamic Sections
        function renderSections() {
            const container = document.getElementById('dynamicSectionContainer');
            const grouped = {};

            Object.keys(currentData).forEach(key => {
                const item = currentData[key];
                if (!grouped[item.cat]) grouped[item.cat] = [];
                grouped[item.cat].push({ key, ...item });
            });

            let html = '';
            Object.keys(grouped).forEach(catName => {
                html += `
                    <section class="section-card category-sec" data-cat="${catName}">
                        <div class="section-header">
                            <h2 class="section-title">${catName}</h2>
                        </div>
                `;
                grouped[catName].forEach(i => {
                    html += `
                        <div class="info-item searchable" onclick="openModal('${i.key}')">
                            <div>
                                <div class="info-item-title">${i.title}</div>
                                <div class="info-item-sub">${i.sub}</div>
                            </div>
                            <span style="color:var(--ff-orange); font-weight:700;">보기 →</span>
                        </div>
                    `;
                });
                html += `</section>`;
            });

            container.innerHTML = html;
        }

        // Switch Tab
        function switchTab(catName, el) {
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            el.classList.add('active');

            document.querySelectorAll('.category-sec').forEach(sec => {
                if (catName === '전체보기' || sec.getAttribute('data-cat') === catName) {
                    sec.style.display = 'block';
                } else {
                    sec.style.display = 'none';
                }
            });
        }

        // Search Filter
        function filterItems() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            document.querySelectorAll('.searchable').forEach(item => {
                item.style.display = item.innerText.toLowerCase().includes(q) ? 'flex' : 'none';
            });
        }

        // Open Modal
        function openModal(key) {
            const data = currentData[key];
            if (!data) return;

            document.getElementById('modalContent').innerHTML = `
                <span class="modal-badge">${data.badge}</span>
                <h3 class="modal-title">${data.title}</h3>
                <div class="modal-body">${data.body}</div>
            `;
            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function closeModalOutside(e) {
            if (e.target.id === 'modalOverlay') closeModal();
        }

        function copyWifiPw() {
            alert('✓ 와이파이 비밀번호(five0401)가 클립보드에 복사되었습니다!');
        }

        // Admin Prompt & Enable
        function toggleAdminPrompt() {
            const panel = document.getElementById('adminPanel');
            if (panel.classList.contains('active')) {
                panel.classList.remove('active');
                document.body.classList.remove('admin-active');
            } else {
                const pw = prompt("관리자 비밀번호를 입력해주세요.", "");
                if (pw === "1234") {
                    enableAdminMode();
                } else if (pw !== null) {
                    alert("비밀번호가 올바르지 않습니다.");
                }
            }
        }

        function enableAdminMode() {
            document.getElementById('adminPanel').classList.add('active');
            document.body.classList.add('admin-active');
            document.getElementById('admHeroTitle').value = document.getElementById('dispHeroTitle').innerText;
            document.getElementById('admWifiPw').value = "five0401";
        }

        function saveAdminChanges() {
            const newTitle = document.getElementById('admHeroTitle').value;
            if (newTitle) document.getElementById('dispHeroTitle').innerText = newTitle;

            localStorage.setItem('ff_app_db', JSON.stringify(currentData));
            alert("✓ 모든 변경사항과 위젯 배치가 정상적으로 저장되었습니다!");
            document.getElementById('adminPanel').classList.remove('active');
            document.body.classList.remove('admin-active');
        }

        function addNewItemPrompt() {
            const title = prompt("새 안내 항목의 제목을 입력하세요:", "새 안내 모듈");
            if (!title) return;

            const key = 'custom_' + Date.now();
            currentData[key] = {
                cat: '웰컴 & 필수 가이드',
                badge: 'CUSTOM',
                title: title,
                sub: '새로 추가된 안내 모듈입니다.',
                body: '<p>신규 등록된 세부 가이드 내용입니다.</p>'
            };

            renderSections();
            alert("신규 모듈이 추가되었습니다. [전체 변경사항 저장하기]를 눌러 완료하세요.");
        }

        // Drag & Drop Widget Logic
        function initDragAndDrop() {
            const grid = document.getElementById('quickWidgetGrid');
            let draggedItem = null;

            grid.addEventListener('dragstart', function(e) {
                if (!document.body.classList.contains('admin-active')) return;
                draggedItem = e.target.closest('.grid-card');
                e.dataTransfer.effectAllowed = 'move';
            });

            grid.addEventListener('dragover', function(e) {
                e.preventDefault();
            });

            grid.addEventListener('drop', function(e) {
                e.preventDefault();
                if (!draggedItem) return;
                const targetCard = e.target.closest('.grid-card');
                if (targetCard && targetCard !== draggedItem) {
                    grid.insertBefore(draggedItem, targetCard);
                }
            });
        }
    </script>
